<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SparkLens{% endblock %}</title>
  <meta name="description" content="Validate your startup idea with AI in seconds. Get a structured analysis with SWOT, market potential, risks and actionable next steps." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --white: #ffffff;
      --bg: #f8f9fc;
      --surface: #ffffff;
      --surface-2: #f1f3f8;
      --border: #e8ebf2;
      --border-dark: #d1d5e0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      --accent: #4f46e5;
      --accent-light: #6366f1;
      --accent-bg: rgba(79, 70, 229, 0.06);
      --accent-border: rgba(79, 70, 229, 0.15);
      --accent-glow: rgba(79, 70, 229, 0.2);
      --green: #059669;
      --green-bg: rgba(5, 150, 105, 0.06);
      --green-border: rgba(5, 150, 105, 0.15);
      --green-glow: rgba(5, 150, 105, 0.2);
      --red: #dc2626;
      --red-bg: rgba(220, 38, 38, 0.06);
      --red-border: rgba(220, 38, 38, 0.15);
      --red-glow: rgba(220, 38, 38, 0.2);
      --amber: #d97706;
      --amber-bg: rgba(217, 119, 6, 0.06);
      --amber-border: rgba(217, 119, 6, 0.15);
      --amber-glow: rgba(217, 119, 6, 0.2);
      --purple: #7c3aed;
      --purple-bg: rgba(124, 58, 237, 0.06);
      --purple-border: rgba(124, 58, 237, 0.15);
      --gradient-accent: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #2563eb 100%);
      --gradient-subtle: linear-gradient(135deg, rgba(79,70,229,0.03) 0%, rgba(124,58,237,0.03) 100%);
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 8px 32px rgba(15, 23, 42, 0.12);
      --shadow-xl: 0 16px 48px rgba(15, 23, 42, 0.16);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, h5, h6 { font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }

    /* === FORM ELEMENTS === */
    .form-input, .form-textarea, .form-select {
      width: 100%;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      padding: 14px 18px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }
    .form-input::placeholder, .form-textarea::placeholder { color: var(--text-tertiary); font-weight: 400; }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-bg), 0 4px 16px var(--accent-glow);
      transform: translateY(-1px);
    }
    .form-select option { background: var(--surface); color: var(--text-primary); }

    /* === BUTTONS === */
    .btn-primary {
      background: var(--gradient-accent);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      padding: 16px 36px;
      font-family: inherit;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
      letter-spacing: -0.01em;
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 100%);
      pointer-events: none;
    }
    .btn-primary:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 40px var(--accent-glow); }
    .btn-primary:active { transform: translateY(0) scale(1); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    .btn-secondary {
      background: var(--surface);
      color: var(--text-primary);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 28px;
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: none;
      padding: 10px 16px;
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      border-radius: var(--radius-sm);
    }
    .btn-ghost:hover { color: var(--accent); background: var(--accent-bg); }

    .btn-danger {
      background: transparent;
      color: var(--red);
      border: 2px solid var(--red-border);
      border-radius: var(--radius-sm);
      padding: 10px 20px;
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-danger:hover { background: var(--red-bg); }

    /* === CARDS === */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card:hover { box-shadow: var(--shadow-md); }

    /* === BADGES === */
    .verdict-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 99px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .verdict-GO { background: var(--green-bg); color: var(--green); border: 1.5px solid var(--green-border); }
    .verdict-CAUTION { background: var(--amber-bg); color: var(--amber); border: 1.5px solid var(--amber-border); }
    .verdict-NOGO { background: var(--red-bg); color: var(--red); border: 1.5px solid var(--red-border); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface-2);
      color: var(--text-tertiary);
      border: 1px solid var(--border);
    }

    /* === LABELS === */
    .label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* === ERROR CARD === */
    .error-card {
      background: var(--red-bg);
      border: 1.5px solid var(--red-border);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      color: var(--red);
      font-size: 14px;
      max-width: 720px;
      margin: 0 auto 24px;
    }
    .error-card a { color: var(--text-primary); text-decoration: underline; }

    /* === SPINNER === */
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.25);
      border-top-color: white;
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* === ANIMATIONS === */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-40px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.3); }
      50% { transform: scale(1.05); }
      70% { transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .anim-fade-up { animation: fadeInUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; opacity: 0; }
    .anim-fade-down { animation: fadeInDown 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; opacity: 0; }
    .anim-scale { animation: scaleIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; opacity: 0; }
    .anim-bounce { animation: bounceIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; opacity: 0; }
    .anim-slide-left { animation: slideInLeft 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; opacity: 0; }
    .anim-slide-right { animation: slideInRight 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; opacity: 0; }

    /* === NAV === */
    nav {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    nav .inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 68px;
    }
    .logo {
      font-weight: 800;
      font-size: 22px;
      color: var(--text-primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.04em;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--gradient-accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      position: relative;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .logo-icon::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 12px;
      background: var(--gradient-accent);
      opacity: 0.3;
      filter: blur(8px);
      z-index: -1;
      animation: pulse-glow 2s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.1); }
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    nav a.nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
    }
    nav a.nav-link:hover { color: var(--accent); background: var(--accent-bg); }

    /* === FOOTER === */
    footer {
      border-top: 1px solid var(--border);
      padding: 40px 24px;
      text-align: center;
      margin-top: 100px;
    }
    footer p { color: var(--text-tertiary); font-size: 13px; }
    footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
    footer a:hover { text-decoration: underline; }

    .container { max-width: 960px; margin: 0 auto; padding: 0 24px; }

    @media (max-width: 640px) {
      .two-col { flex-direction: column !important; gap: 16px !important; }
      .two-col > * { width: 100% !important; }
      .swot-grid { grid-template-columns: 1fr !important; }
      .scores-row { flex-direction: column !important; gap: 20px !important; }
      .header-row { flex-direction: column !important; align-items: flex-start !important; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav>
  <div class="inner">
    <a href="{% url 'home' %}" class="logo">
      <div class="logo-icon">&#9889;</div>
      SparkLens
    </a>
    <div class="nav-links">
      <a href="{% url 'home' %}" class="nav-link">Validate</a>
      <a href="{% url 'history' %}" class="nav-link">History</a>
    </div>
  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  <p>Built by <a href="#">AJ</a> &middot; SparkLens &copy; 2026</p>
</footer>

{% block extra_js %}{% endblock %}
</body>
</html>
